    <!-- Custom converter section -->
    <div id="container">
      <div id="lowBox">
        <h3>Custom</h3>
        <section id="converter" aria-label="Simple converter">
          <div class="input">
            <label for="unitFrom">From:</label>
            <select id="unitFrom">
              <option value="mph" selected>MPH</option>
              <option value="kmh">KMH</option>
            </select>

            <input id="valueIn" type="number" step="any" placeholder="Enter Value:">
          </div>
          <div class="equals">=</div>
          <div class="output">
            <label for="unitTo">To:</label>
            <select id="unitTo">
              <option value="mph">MPH</option>
              <option value="kmh" selected>KMH</option>
            </select>

            <div id="result">Output:</div>
          </div>
        </section>
      </div>
    </div>
