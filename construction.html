    <section class="page-header">
      <h1>Construction &amp; DIY</h1>
      <p>Common, simple measurements.</p>

    <aside>
      <p>Thanks for using my site!</p>
    </aside>

    <!-- Basic or common measurements. -->
    <div class="tables-grid">
      <figure class="table-figure" aria-label="Length">
        <table>
          <caption>Length</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1 inch</td>
              <td>2.54 cm</td>
            </tr>
            <tr>
              <td>12 inches (1 ft)</td>
              <td>30.48 cm</td>
            </tr>
            <tr>
              <td>1 yard</td>
              <td>3 ft</td>
            </tr>
            <tr>
              <td>1 meter</td>
              <td>100 cm</td>
            </tr>
          </tbody>
        </table>
      </figure>

      <figure class="table-figure" aria-label="Other">
        <table>
          <caption>Area</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1 mile</td>
              <td>0.62 km</td>
            </tr>
            <tr>
              <td>1 acre</td>
              <td>43,560 sq ft</td>
            </tr>
            <tr>
              <td>1 yard</td>
              <td>3 ft</td>
            </tr>
            <tr>
              <td>3 ft</td>
              <td>36 inches</td>
            </tr>
            <tr>
              <td>1 meter</td>
              <td>39.37 inches</td>
            </tr>
          </tbody>
        </table>
      </figure>


      <figure class="table-figure" aria-label="Other">
        <table>
          <caption>Other</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>"2x4"</td>
              <td>Actual ≈ 1.50 in × 3.50 in</td>
            </tr>
          </tbody>
        </table>
      </figure>

    </div>

    <!-- Custom converter section -->
    <div id="container">
      <div id="lowBox">
        <h3>Custom</h3>
        <section id="converter" aria-label="Simple converter">
          <div class="input">
            <label for="unitFrom">From:</label>
            <select id="unitFrom">
              <option value="inch" selected>Inch</option>
              <option value="foot">Foot</option>
              <option value="yard">Yard</option>
              <option value="meter">Meter</option>
              <option value="centimeter">Centimeter</option>
            </select>

            <input id="valueIn" type="number" step="any" placeholder="Enter Value:">
          </div>
          <div class="equals">=</div>
          <div class="output">
            <label for="unitTo">To:</label>
            <select id="unitTo">
              <option value="meter">Meter</option>
              <option value="centimeter">Centimeter</option>
              <option value="foot" selected>Foot</option>
              <option value="inch">Inch</option>
              <option value="yard">Yard</option>
            </select>

            <div id="result">Output:</div>
          </div>
        </section>
      </div>
    </div>
