    <nav aria-label="Primary">
      <div id="logoCR">
        <!-- The site logo and abbreviation of site title -->

  <main id="main">

    <section class="page-header">
      <h1>Health &amp; Fitness</h1>
      <p>Common, rounded values.</p>
    </section>

    <aside>
      <p>Thanks for using my site!</p>
    </aside>

    <!-- Basic or common measurements. -->
    <div class="tables-grid">
      <figure class="table-figure" aria-label="Weight">
        <table>
          <caption>Weight</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1 lb</td>
              <td>0.45 kg</td>
            </tr>
            <tr>
              <td>10 lb</td>
              <td>4.54 kg</td>
            </tr>
            <tr>
              <td>50 lb</td>
              <td>22.68 kg</td>
            </tr>
            <tr>
              <td>100 lb</td>
              <td>45.36 kg</td>
            </tr>
            <tr>
              <td>1 kg</td>
              <td>2.20 lb</td>
            </tr>
          </tbody>
        </table>
      </figure>

      <figure class="table-figure" aria-label="Height">
        <table>
          <caption>Height</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1 in</td>
              <td>2.54 cm</td>
            </tr>
            <tr>
              <td>12 in (1 ft)</td>
              <td>30.48 cm</td>
            </tr>
            <tr>
              <td>5 ft 6 in</td>
              <td>167.64 cm</td>
            </tr>
            <tr>
              <td>6 ft 0 in</td>
              <td>182.88 cm</td>
            </tr>
          </tbody>
        </table>
      </figure>

      <figure class="table-figure" aria-label="Energy">
        <table>
          <caption>Energy</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1 kcal</td>
              <td>4.18 kJ</td>
            </tr>
            <tr>
              <td>100 kcal</td>
              <td>418.40 kJ</td>
            </tr>
          </tbody>
        </table>
      </figure>

      <figure class="table-figure" aria-label="Weight">
        <table>
          <caption>BMI Chart</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Under 18.5</td>
              <td>Underweight</td>
            </tr>
            <tr>
              <td>18.5 - 24.9</td>
              <td>Normal weight</td>
            </tr>
            <tr>
              <td>25 - 29.9</td>
              <td>Overweight</td>
            </tr>
            <tr>
              <td>Above 30</td>
              <td>Obese</td>
            </tr>
          </tbody>
        </table>
      </figure>

    </div>

    <!-- Custom converter section -->
    <div id="container">
      <div id="lowBox">
        <h3>Custom</h3>
        <section id="converter" aria-label="Simple converter">
          <div class="input">
            <label for="unitFrom">From:</label>
            <select id="unitFrom">
              <option value="pound" selected>Pound</option>
              <option value="kilogram">Kilogram</option>
            </select>

            <input id="valueIn" type="number" step="any" placeholder="Enter Value:">
          </div>
          <div class="equals">=</div>
          <div class="output">
            <label for="unitTo">To:</label>
            <select id="unitTo">
              <option value="pound">Pound</option>
              <option value="kilogram" selected>Kilogram</option>
            </select>

            <div id="result">Output:</div>
          </div>
        </section>
      </div>
    </div>

  </main>
