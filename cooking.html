    <!-- Custom converter section -->
    <div id="container">
      <div id="lowBox">
        <h3>Custom</h3>
        <section id="converter" aria-label="Simple converter">
          <div class="input">
            <label for="unitFrom">From:</label>
            <select id="unitFrom">
              <option value="cup">Cup</option>
              <option value="tablespoon" selected>Tablespoon</option>
              <option value="teaspoon">Teaspoon</option>
              <option value="fluid-ounces">Fluid Ounce</option>
              <option value="milliliter">Milliliter</option>
              <option value="liter">Liter</option>
              <option value="quart">Quart</option>
              <option value="pint">Pint</option>
              <option value="gallon">Gallon</option>
              <!-- <option value="ounce">Ounce</option>
              <option value="pound">Pound</option>
              <option value="gram">Gram</option> -->
            </select>

            <input id="valueIn" type="number" step="any" placeholder="Enter Value:">
          </div>
          <div class="equals">=</div>
          <div class="output">
            <label for="unitTo">To:</label>
            <select id="unitTo">
              <option value="cup">Cup</option>
              <option value="tablespoon" selected>Tablespoon</option>
              <option value="teaspoon">Teaspoon</option>
              <option value="fluid-ounces">Fluid Ounce</option>
              <option value="milliliter">Milliliter</option>
              <option value="liter">Liter</option>
              <option value="quart">Quart</option>
              <option value="pint">Pint</option>
              <option value="gallon">Gallon</option>
              <!-- <option value="ounce">Ounce</option>
              <option value="pound">Pound</option>
              <option value="gram">Gram</option> -->
            </select>

            <div id="result">Output:</div>
          </div>
        </section>
      </div>
