  <main id="main">

    <section class="page-header">
      <h1>Time &amp; Scheduling</h1>
      <p>For time conversions. For months assume 30 days.</p>
    </section>

    <aside>
      <p>Thanks for using my site!</p>
    </aside>

    <!-- Basic or common measurements. -->
    <div class="tables-grid">
      <figure class="table-figure" aria-label="Basics">
        <table>
          <caption>Basics</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1 hour</td>
              <td>60 minutes</td>
            </tr>
            <tr>
              <td>1 day</td>
              <td>24 hours</td>
            </tr>
            <tr>
              <td>1 week</td>
              <td>7 days</td>
            </tr>
          </tbody>
        </table>
      </figure>

      <figure class="table-figure" aria-label="Days to Months">
        <table>
          <caption>Days → Months (≈)</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>30 days</td>
              <td>1 month</td>
            </tr>
            <tr>
              <td>60 days</td>
              <td>2 months</td>
            </tr>
            <tr>
              <td>90 days</td>
              <td>3 months</td>
            </tr>
          </tbody>
        </table>
      </figure>

      <figure class="table-figure" aria-label="Hours">
        <table>
          <caption>Hours (common spans)</caption>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>24 hours</td>
              <td>1 day</td>
            </tr>
            <tr>
              <td>168 hours</td>
              <td>1 week</td>
            </tr>
            <tr>
              <td>730.00 hours</td>
              <td>≈ 1 month</td>
            </tr>
            <tr>
              <td>8,760.00 hours</td>
              <td>≈ 1 year (365 days)</td>
            </tr>
          </tbody>
        </table>
      </figure>

      <figure class="table-figure" aria-label="Frame Time">
        <table>
          <caption>Frame Time</caption>
          <thead>
            <tr>
              <th>FPS</th>
              <th>ms per frame</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>30 FPS</td>
              <td>33.33 ms</td>
            </tr>
            <tr>
              <td>60 FPS</td>
              <td>16.67 ms</td>
            </tr>
            <tr>
              <td>120 FPS</td>
              <td>8.33 ms</td>
            </tr>
          </tbody>
        </table>
      </figure>

    </div>

    <!-- Custom converter section -->
    <div id="container">
      <div id="lowBox">
        <h3>Custom</h3>
        <section id="converter" aria-label="Simple converter">
          <div class="input">
            <label for="unitFrom">From:</label>
            <select id="unitFrom">
              <option value="day" selected>Day</option>
              <option value="second">Second</option>
              <option value="minute">Minute</option>
              <option value="hour">Hour</option>
              <option value="week">Week</option>
              <option value="month">Month</option>
              <option value="year">Year</option>
            </select>

            <input id="valueIn" type="number" step="any" placeholder="Enter Value:">
          </div>
          <div class="equals">=</div>
          <div class="output">
            <label for="unitTo">To:</label>
            <select id="unitTo">
              <option value="day">Day</option>
              <option value="second">Second</option>
              <option value="minute" selected>Minute</option>
              <option value="hour">Hour</option>
              <option value="week">Week</option>
              <option value="month">Month</option>
              <option value="year">Year</option>
            </select>

            <div id="result">Output:</div>
          </div>
        </section>
      </div>
    </div>

  </main>
